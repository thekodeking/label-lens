services:
  - type: web
    name: label-lens
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LABEL_LENS_OCR_MODELS
        value: gemini-2.5-flash,gemma-4-31b-it,gemma-4-26b-a4b-it
      - key: LABEL_LENS_LOG_LEVEL
        value: DEBUG
